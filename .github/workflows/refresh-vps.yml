name: Refresh LineaMeteo VPS dashboard

on:
  schedule:
    # Allow the operational fields time to appear on the public data servers.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/refresh-vps.yml"

permissions:
  contents: write

concurrency:
  group: vps-data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore climatology cache
        uses: actions/cache@v4
        with:
          path: public/data/climatology.npz
          key: vps-climatology-ncep-r1-1991-2020-v1
      - name: Install GRIB tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
      - name: Download model data and build dashboard assets
        run: |
          mkdir -p public/data/maps
          python pipeline/build_vps.py
      - name: Publish generated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VPS model data and maps"
            git push origin HEAD:main
          else
            echo "No dashboard data changed."
          fi
      - name: Stage generated maps for Pages upload
        run: |
          map_count=$(find public/data/maps -type f -name '*.png' | wc -l)
          echo "Generated map images: $map_count"
          test "$map_count" -gt 0
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("public/data/dashboard.json").read_text())
          map_count = len(list(Path("public/data/maps").glob("*.png")))
          links = {url for model in data.get("models", {}).values()
                   for levels in model.get("maps", {}).values()
                   for steps in levels.values() for url in steps.values()}
          missing = [url for url in links if url.startswith("/data/maps/") and not Path("public", url.lstrip("/")).is_file()]
          if not links or missing:
              raise SystemExit(f"Map feed/files mismatch: {len(links)} links, {len(missing)} missing local PNGs")
          print(f"Map feed verified: {len(links)} links, {map_count} local PNG files")
          PY
          # Map PNGs are intentionally excluded from repository commits, but
          # staging them makes the ignored files visible to the Pages uploader.
          git add --force public/data/maps/*.png
      - name: Deploy current dashboard and maps to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CF_PAGES_PROJECT"
          npx --yes wrangler@4 pages deploy public --project-name "$CF_PAGES_PROJECT" --branch main
      - name: Verify deployed map images
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import urlopen
          data = json.loads(Path("public/data/dashboard.json").read_text())
          links = sorted({url for model in data.get("models", {}).values()
                          for levels in model.get("maps", {}).values()
                          for steps in levels.values() for url in steps.values()})
          if not links:
              raise SystemExit("No map URLs in dashboard feed")
          base = f"https://{os.environ['CF_PAGES_PROJECT']}.pages.dev"
          for link in links[:10]:
              url = link if link.startswith("http") else base + link
              with urlopen(url, timeout=30) as response:
                  body = response.read(8)
                  if response.status != 200 or body != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"Map verification failed: {url} returned non-PNG content")
          print(f"Cloudflare map verification passed: {min(10, len(links))} image URLs return PNG")
          PY
