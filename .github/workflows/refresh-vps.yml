name: Refresh LineaMeteo VPS dashboard

on:
  schedule:
    # Allow the operational fields time to appear on the public data servers.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "public/**"
      - ".github/workflows/refresh-vps.yml"

permissions:
  contents: write

concurrency:
  group: vps-data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore climatology cache
        uses: actions/cache@v4
        with:
          path: public/data/climatology.npz
          key: vps-climatology-ncep-r1-1991-2020-v2
      - name: Install GRIB tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
      - name: Download model data and build dashboard assets
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          mkdir -p public/data/maps
          # Map PNGs are generated assets and intentionally are not committed
          # to Git. Restore the currently deployed files first so an unchanged
          # model cycle can be reused instead of downloaded and rendered again.
          python - <<'PY'
          import json, os
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          feed = Path("public/data/dashboard.json")
          project = os.environ.get("CF_PAGES_PROJECT", "").strip()
          if not feed.exists() or not project:
              print("No previous map feed or Pages project configured; maps will be built from source data.")
              raise SystemExit(0)
          base = f"https://{project}.pages.dev"
          data = json.loads(feed.read_text(encoding="utf-8"))
          links = {url for model in data.get("models", {}).values()
                   for levels in model.get("maps", {}).values()
                   for steps in levels.values() for url in steps.values()
                   if isinstance(url, str) and url.startswith("/data/maps/")}
          def restore(link):
              filename = Path(link).name
              if not filename.endswith(".png") or filename in ("", ".", ".."):
                  return "failed", link, "invalid map filename"
              target = Path("public/data/maps") / filename
              if target.is_file():
                  return "present", link, None
              try:
                  request = Request(base + link, headers={"User-Agent": "LineaMeteo-VPS-map-cache/1.0"})
                  with urlopen(request, timeout=10) as response:
                      content = response.read()
                  if not content.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise ValueError("response is not a PNG")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
                  return "restored", link, None
              except (HTTPError, URLError, TimeoutError, ValueError, OSError) as exc:
                  return "failed", link, str(exc)

          restored = failed = 0
          with ThreadPoolExecutor(max_workers=12) as pool:
              for future in as_completed([pool.submit(restore, link) for link in sorted(links)]):
                  status, link, error = future.result()
                  restored += status == "restored"
                  if status == "failed":
                      failed += 1
                      print(f"Previous map could not be restored: {link}: {error}")
          print(f"Restored {restored} of {len(links)} deployed maps; {failed} unavailable. Missing assets will be rebuilt.")
          PY
          python pipeline/build_vps.py
          # Drop restored images from superseded model cycles. Keep exactly the
          # PNGs linked by the new feed so each deployment stays bounded.
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          data = json.loads(Path("public/data/dashboard.json").read_text(encoding="utf-8"))
          wanted = {Path(urlsplit(url).path).name
                    for model in data.get("models", {}).values()
                    for levels in model.get("maps", {}).values()
                    for steps in levels.values() for url in steps.values()
                    if isinstance(url, str) and Path(urlsplit(url).path).name.endswith(".png")}
          map_dir = Path("public/data/maps")
          removed = 0
          for image in map_dir.glob("*.png"):
              if image.name not in wanted:
                  image.unlink()
                  removed += 1
          print(f"Retained {len(wanted)} referenced maps; removed {removed} superseded images.")
          PY
      - name: Publish generated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json public/data/history.json public/data/ifs_s2s_hindcast.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VPS model data and maps"
            git push origin HEAD:main
          else
            echo "No dashboard data changed."
          fi
      - name: Stage generated maps for Pages upload
        run: |
          map_count=$(find public/data/maps -type f -name '*.png' | wc -l)
          echo "Generated map images: $map_count"
          test "$map_count" -gt 0
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("public/data/dashboard.json").read_text())
          map_count = len(list(Path("public/data/maps").glob("*.png")))
          links = {url for model in data.get("models", {}).values()
                   for levels in model.get("maps", {}).values()
                   for steps in levels.values() for url in steps.values()}
          missing = [url for url in links if url.startswith("/data/maps/") and not Path("public", url.lstrip("/")).is_file()]
          if not links or missing:
              raise SystemExit(f"Map feed/files mismatch: {len(links)} links, {len(missing)} missing local PNGs")
          print(f"Map feed verified: {len(links)} links, {map_count} local PNG files")
          PY
          # Map PNGs are intentionally excluded from repository commits, but
          # staging them makes the ignored files visible to the Pages uploader.
          git add --force public/data/maps/*.png
      - name: Deploy current dashboard and maps to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CF_PAGES_PROJECT"
          npx --yes wrangler@4 pages deploy public --project-name "$CF_PAGES_PROJECT" --branch main
      - name: Verify deployed map images
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          python - <<'PY'
          import json, os
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          data = json.loads(Path("public/data/dashboard.json").read_text())
          links = sorted({url for model in data.get("models", {}).values()
                          for levels in model.get("maps", {}).values()
                          for steps in levels.values() for url in steps.values()})
          if not links:
              raise SystemExit("No map URLs in dashboard feed")
          base = f"https://{os.environ['CF_PAGES_PROJECT']}.pages.dev"
          png_signature = b"\x89PNG\r\n\x1a\n"
          for link in links[:10]:
              url = link if link.startswith("http") else base + link
              last_error = "no response"
              for attempt in range(1, 6):
                  separator = "&" if "?" in url else "?"
                  request = Request(
                      f"{url}{separator}verify={int(time.time())}-{attempt}",
                      headers={"User-Agent": "Mozilla/5.0 LineaMeteo-VPS-map-check/1.0", "Cache-Control": "no-cache"},
                  )
                  try:
                      with urlopen(request, timeout=30) as response:
                          body = response.read(8)
                          content_type = response.headers.get("Content-Type", "unknown")
                          if response.status == 200 and body == png_signature:
                              break
                          last_error = f"HTTP {response.status}, content-type={content_type!r}, first bytes={body!r}"
                  except (HTTPError, URLError, TimeoutError) as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                  if attempt < 5:
                      time.sleep(min(2 ** attempt, 16))
              else:
                  raise SystemExit(f"Map verification failed after 5 attempts: {url}; {last_error}")
          print(f"Cloudflare map verification passed: {min(10, len(links))} image URLs return PNG")
          PY
